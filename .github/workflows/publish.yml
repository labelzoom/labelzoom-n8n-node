name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance. n8n has required verified community nodes to be
  # published from a GitHub Action with a provenance statement since 2026-05-01;
  # publishing from a laptop is no longer accepted.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
